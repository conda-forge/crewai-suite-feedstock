# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.15.35"

recipe:
  name: crewai-suite
  version: ${{ version }}

build:
  number: 0

outputs:
  - package:
      name: crewai-core
      version: ${{ version }}
    source:
      - url: https://pypi.org/packages/source/c/crewai_core/crewai_core-${{ version }}.tar.gz
        sha256: bbd3680f9f15739134afdac625b53646e2fea287c82728971d9bcf7ef2ab3589
    build:
      noarch: python
      script: |
        pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python ${{ python_min }}.*
        - hatchling
        - pip
      run:
        - python >=${{ python_min }},<3.14
        - appdirs >=1.4.4,<1.5.0
        - cryptography >=42.0
        - httpx >=0.28.1,<0.29.0
        - packaging >=23.0
        - portalocker >=2.7.0,<2.8.0
        - pyjwt >=2.15.0,<3
        - pydantic >=2.11.9,<2.13.0
        - rich >=13.7.1
        - opentelemetry-api >=1.45.1,<2
        - opentelemetry-sdk >=1.45.1,<2
        - opentelemetry-exporter-otlp-proto-http >=1.45.1,<2
        - tomli >=2.0.2,<2.1.0
    tests:
      - python:
          imports:
            - crewai_core
          pip_check: false
          python_version: ${{ python_min }}.*
    about:
      summary: Shared utilities for CrewAI — version, paths, user-data, telemetry, printer."
      license: MIT
      license_file: LICENSE
      homepage: https://github.com/crewAIInc/crewAI

  - package:
      name: crewai-cli
      version: ${{ version }}
    source:
      - url: https://pypi.org/packages/source/c/crewai_cli/crewai_cli-${{ version }}.tar.gz
        sha256: 8136af9b5b557d1f52cce086d89751ec421425d54fc5d64ee64afa5aeb7b5364
    build:
      noarch: python
      python:
        entry_points:
          - crewai = crewai_cli.cli:crewai
      script: |
        pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python ${{ python_min }}.*
        - hatchling
        - pip
      run:
        - python >=${{ python_min }},<3.14
        - ${{ pin_subpackage('crewai-core', exact=True) }}
        - click >=8.1.7,<9
        - pydantic >=2.11.9,<2.13.0
        - pydantic-settings >=2.14.1,<3
        - appdirs >=1.4.4,<1.5.0
        - cryptography >=42.0
        - httpx >=0.28.1,<0.29.0
        - pyjwt >=2.15.0,<3
        - rich >=13.7.1
        - tomli >=2.0.2,<2.1.0
        - tomli-w >=1.1.0,<1.2.0
        - packaging >=23.0
        - python-dotenv >=1.2.2,<2
        - uv >=0.13.4,<1
        - textual>=7.5.0
        - certifi >=2026.10.18
    tests:
      - python:
          imports:
            - crewai_cli
          pip_check: false
          python_version: ${{ python_min }}.*
      - script:
          - crewai --help
        requirements:
          run:
            - python ${{ python_min }}.*
    about:
      summary: CLI for CrewAI — scaffold, run, deploy and manage AI agent crews.
      license: MIT
      license_file: LICENSE
      homepage: https://github.com/crewAIInc/crewAI

  - package:
      name: crewai
      version: ${{ version }}
    source:
      - url: https://pypi.org/packages/source/c/crewai/crewai-${{ version }}.tar.gz
        sha256: 390eaec826ccdf561eddc23d0d9bda3cb995f0651c4e170f11488702dee73f6f
    build:
      noarch: python
      python:
        entry_points:
          - crewai = crewai_cli.cli:crewai
      script: |
        python -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python ${{ python_min }}.*
        - hatchling
        - pip
      run:
        - python >=${{ python_min }},<3.14
        - ${{ pin_subpackage('crewai-core', exact=True) }}
        - ${{ pin_subpackage('crewai-cli', exact=True) }}
        - pydantic >=2.11.9,<2.13
        - openai >=2.30.0,<3
        - instructor >=1.3.3,<1.16
        - pdfplumber >=0.11.4,<0.12.0
        - regex >=2026.1.15,<2026.2.0
        - opentelemetry-api >=1.42.0,<2
        - opentelemetry-sdk >=1.42.0,<2
        - opentelemetry-api >=1.45.1,<2
        - opentelemetry-sdk >=1.45.1,<2
        - opentelemetry-exporter-otlp-proto-http >=1.45.1,<2
        - chromadb >=1.5.9,<1.6.0
        - tokenizers >=0.21,<1
        - openpyxl >=3.1.5,<3.2.0
        - python-dotenv >=1.2.2,<2
        - pyjwt >=2.15.0,<3
        - oauthlib >=4.0.0,<5
        - click >=8.1.7,<9
        - appdirs >=1.4.4,<1.5.0
        - jsonref >=1.1.0,<1.2.0
        - json-repair >=0.60.1,<0.61.0
        - cel-python >=0.5.0,<0.6
        - tomli-w >=1.1.0,<1.2.0
        - tomli >=2.0.2,<2.1.0
        - json5 >=0.10.0,<0.11.0
        - portalocker >=2.7.0,<2.8.0
        - pydantic-settings >=2.14.2,<3
        - httpx >=0.28.1,<0.29.0
        - mcp >=1.30.0,<2
        - aiosqlite >=0.21.0,<0.22.0
        - pyyaml >=6.0,<7.0
        - aiofiles >=24.1.0,<24.2.0
        - lancedb >=0.33.0,<1.0.0
    tests:
      - python:
          imports:
            - crewai
          pip_check: false
          python_version: ${{ python_min }}.*
      - script:
          - crewai --help
        requirements:
          run:
            - python ${{ python_min }}.*
    about:
      summary: Cutting-edge framework for orchestrating role-playing, autonomous AI agents. By fostering collaborative intelligence, CrewAI empowers agents to work together seamlessly, tackling complex tasks.
      license: MIT
      license_file: LICENSE
      homepage: https://github.com/crewAIInc/crewAI

  - package:
      name: crewai-tools
      version: ${{ version }}
    source:
      - url: https://pypi.org/packages/source/c/crewai_tools/crewai_tools-${{ version }}.tar.gz
        sha256: a617cbb05c6b390dab6efac97762c22c214a2a737010d468c49750f6023acfc3
    build:
      noarch: python
      script: |
        pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python ${{ python_min }}.*
        - hatchling
        - pip
      run:
        - python >=${{ python_min }},<3.14
        - ${{ pin_subpackage('crewai', exact=True) }}
        - pytube >=15.0.0,<15.1.0
        - requests >=2.33.0,<3
        - tiktoken >=0.8.0,<0.13
        - beautifulsoup4 >=4.13.4,<5
        - python-docx >=1.2.0,<1.3.0
        - youtube-transcript-api >=1.2.2,<1.3.0
        - pymupdf >=1.26.6,<1.27.0
    tests:
      - python:
          imports:
            - crewai_tools
          pip_check: false
          python_version: ${{ python_min }}.*
    about:
      summary: Set of tools for the crewAI framework
      license: MIT
      license_file: LICENSE
      homepage: https://github.com/crewAIInc/crewAI

  - package:
      name: crewai-files
      version: ${{ version }}
    source:
      - url: https://pypi.org/packages/source/c/crewai-files/crewai_files-${{ version }}.tar.gz
        sha256: c8c96db84a36924188f4421c52dc02d823a4a2de8f900dbc7344d9f51a5d3e96
    build:
      noarch: python
      script: |
        pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python ${{ python_min }}.*
        - hatchling
        - pip
      run:
        - python >=${{ python_min }},<3.14
        - pillow >=13.0.0
        - pypdf >=6.21.2,<7
        - python-magic >=0.4.27
        - aiocache >=0.12.3,<0.13.0
        - aiofiles >=24.1.0,<24.2.0
        - tinytag >=2.3.0,<3
        - av >=13.0.0,<13.1.0
        - pydantic >=2.11.9,<2.13.0
    tests:
      - python:
          imports:
            - crewai_files
          pip_check: false
          python_version: ${{ python_min }}.*
    about:
      summary: File handling utilities for CrewAI multimodal inputs
      license: MIT
      license_file: LICENSE
      homepage: https://github.com/crewAIInc/crewAI

about:
  summary: CrewAI framework and tools for orchestrating autonomous AI agents
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/crewAIInc/crewAI

extra:
  recipe-maintainers:
    - soapy1
